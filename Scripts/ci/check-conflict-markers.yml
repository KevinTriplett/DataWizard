name: Check for conflict markers

# Server-side backstop to the local pre-commit guard: fails the push if any
# tracked file contains unresolved merge-conflict markers outside a fenced
# code block. Pairs with check-filenames.yml (Windows-unsafe filename check).
#
# A bare '=======' is ALSO a valid markdown setext heading underline, so it is
# only treated as a conflict marker when the same file also contains '<<<<<<<'.
# A real conflict always has the opening marker; a setext heading never does.
#
# NOTE: the awk grammar below is kept in sync with the pre-commit hook
# (Seed/Scripts/hooks/pre-commit) -- one grammar, two surfaces. Edit both together.

on:
  push:
  workflow_dispatch:

jobs:
  check-conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Scan tracked files for conflict markers
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r -d '' path; do
            # skip Obsidian workspace/plugin state (mirrors the pre-commit hook)
            case "$path" in .obsidian/*|*/.obsidian/*) continue ;; esac
            # skip binary and empty files
            grep -Iq . "$path" || continue
            if ! awk -v fname="$path" '
              { sub(/\r$/, ""); s = $0; sub(/^ ? ? ?/, "", s) }
              s ~ /^```/ || s ~ /^~~~/ { infence = !infence; next }
              infence { next }
              s ~ /^<<<<<<</ { print "::error file=" fname ",line=" FNR "::Unresolved conflict marker: " $0; hit = 1; sawopen = 1; next }
              s ~ /^>>>>>>>/ || s ~ /^\|\|\|\|\|\|\|/ { print "::error file=" fname ",line=" FNR "::Unresolved conflict marker: " $0; hit = 1; next }
              s ~ /^=======$/ { eq[++neq] = "::error file=" fname ",line=" FNR "::Unresolved conflict marker: " $0 }
              END { if (sawopen && neq) { for (i = 1; i <= neq; i++) print eq[i]; hit = 1 } exit (hit ? 1 : 0) }' "$path"; then
              fail=1
            fi
          done < <(git -c core.quotePath=false ls-files -z)
          if [ "$fail" -ne 0 ]; then
            echo "Found unresolved conflict markers. Remove the <<<<<<< / ======= / >>>>>>> lines and keep the intended text."
            exit 1
          fi
          echo "No conflict markers in tracked files."
